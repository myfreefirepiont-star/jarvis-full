
name: Build JARVIS Android APK

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q JARVIS-Android-v5.2.1.zip -d extracted
          PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix reminder argument order
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/jarvis/ai/ReminderReceiver.kt"
          sed -i 's/ReminderStore.schedule(context, item.first, item.second, item.third)/ReminderStore.schedule(context, item.first, item.third, item.second)/' "$FILE"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
