
      - name: Extract JARVIS project
        run: |
          unzip -q JARVIS-Android-v5.2.1.zip -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix reminder argument order
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/jarvis/ai/ReminderReceiver.kt"
          grep -n "ReminderStore.schedule" "$FILE"
          sed -i 's/ReminderStore.schedule(context, item.first, item.second, item.third)/ReminderStore.schedule(context, item.first, item.third, item.second)/' "$FILE"
          grep -n "ReminderStore.schedule" "$FILE"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
